x-phase3: &phase3
 image: node:24-bookworm-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
 working_dir: /workspace
 init: true
 volumes:
  - .:/workspace
  - ${LIFE_DASHBOARD_SHARED_ROOT:?Use the Codex wrapper}/node_modules:/workspace/node_modules:ro
 environment: &isolated
  NODE_ENV: test
  APP_PROFILE: mvp
  COREPACK_ENABLE_NETWORK: '0'
  PHASE3_ACCEPTANCE: codex-phase3
  ACCEPTANCE_PROJECT: life-dashboard-v0-2-codex
  PHASE2_ACCEPTANCE: codex
  PHASE2_BROWSER: isolated
  DATABASE_HOST: postgres-test
  DATABASE_NAME: life_dashboard_test
  DATABASE_USER: life_dashboard
  POSTGRES_PASSWORD: isolated-test-only
  LOCAL_LOGIN_SECRET: codex-phase3-synthetic-browser-login-secret
  APP_ORIGIN: http://gateway-test
  TEST_ORIGIN: http://gateway-test
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
services:
 api-test:
  <<: *phase3
  command: [node_modules/.bin/tsx, tests/v02-phase3/server.ts]
  healthcheck:
   test: [CMD, node, -e, "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
   interval: 2s
   retries: 30
 web-test:
  <<: *phase3
  environment:
   <<: *isolated
   WEB_HOST: 0.0.0.0
  command: [node, apps/web/dev-server.mjs]
  healthcheck:
   test: [CMD, node, -e, "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
   interval: 2s
   retries: 30
 gateway-test:
  image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
  command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
  volumes: [./tests/v02-phase3/Caddyfile:/etc/caddy/Caddyfile:ro]
 browser-test:
  <<: *phase3
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
  shm_size: 1gb
  tmpfs: [/tmp]
  command: [node_modules/.bin/tsx, --test, tests/v02-phase3/browser.test.ts]
