# Test-only overlay: use the codex or gemini wrapper; never the main deployment.
# API and browser share the explicitly synthetic postgres-test database.
services:
  api:
    environment:
      NODE_ENV: test
      APP_PROFILE: mvp
      DATABASE_HOST: postgres-test
      DATABASE_NAME: life_dashboard_test
      POSTGRES_PASSWORD: isolated-test-only
      LOCAL_LOGIN_SECRET: v02-phase2-isolated-browser-login-secret
      APP_ORIGIN: http://gateway
    depends_on: !override
      postgres-test: {condition: service_healthy}
  web:
    environment:
      APP_ORIGIN: http://gateway
  browser:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    working_dir: /workspace
    init: true
    shm_size: 1gb
    volumes:
      - .:/workspace
      - ${LIFE_DASHBOARD_SHARED_ROOT:?Use the agent wrapper}/node_modules:/workspace/node_modules:ro
    environment:
      NODE_ENV: test
      APP_PROFILE: mvp
      PHASE2_BROWSER: isolated
      DATABASE_HOST: postgres-test
      DATABASE_NAME: life_dashboard_test
      DATABASE_USER: life_dashboard
      POSTGRES_PASSWORD: isolated-test-only
      LOCAL_LOGIN_SECRET: v02-phase2-isolated-browser-login-secret
      APP_ORIGIN: http://gateway
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    tmpfs: [/tmp]
    command: [node_modules/.bin/tsx, --test, tests/v02-phase2/browser.ts]
