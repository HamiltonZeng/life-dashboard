name: life-dashboard-compact
services:
  app:
    image: life-dashboard:compact-2026-10-24
    pull_policy: never
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .secrets/development.env
    ports:
      - 127.0.0.1:18380:8080
    volumes:
      - ./.runtime/data/postgres:/var/lib/postgresql
      - ./.runtime/compact-state:/workspace/.runtime
    tmpfs: [/tmp]
